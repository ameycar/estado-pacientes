<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Administración - Configuración TV</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .admin-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      max-width: 600px;
      margin: 0 auto;
      border: 1px solid #334155;
    }

    h2 {
      margin-top: 0;
      color: #38bdf8;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 8px;
    }

    .form-section {
      margin-bottom: 20px;
    }

    .form-section h3 {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }

    .color-pickers-row {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .color-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 50px;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid #ffffff;
      border-radius: 6px;
    }

    .preview-box {
      margin-top: 10px;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      color: #ffffff;
      border: 2px solid #38bdf8;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: background 0.3s ease;
    }

    .btn-guardar {
      width: 100%;
      padding: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-guardar:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2><i class="fas fa-sliders-h"></i> Personalizar Pantalla TV</h2>

    <div class="form-group">
      <label for="select-marca-admin">Seleccionar Marca / Razón Social a Personalizar:</label>
      <select id="select-marca-admin">
        <option value="CDI">CDI (Centro de Diagnóstico e Imágenes)</option>
        <option value="GRUPO_QUITO">GRUPO QUITO (Servicios Médicos Integrales)</option>
        <option value="RESOTEM">RESOTEM (Resonancia y Tomografía)</option>
      </select>
    </div>

    <div class="form-section">
      <h3>1. Banners y Colores Institucionales</h3>
      
      <div class="color-pickers-row" style="margin-bottom: 15px;">
        <div class="color-item">
          <label>Color Encabezado:</label>
          <input type="color" id="input-color-header" value="#0284c7">
        </div>
        <div class="color-item">
          <label>Color Reloj / Acento:</label>
          <input type="color" id="input-color-acento" value="#38bdf8">
        </div>
      </div>

      <div class="form-group">
        <label>Gradiente Banner Llamado (Selección Visual):</label>
        <div class="color-pickers-row">
          <div class="color-item">
            <small style="color: #94a3b8;">Color Inicial</small>
            <input type="color" id="input-gradiente-1" value="#0284c7">
          </div>
          <i class="fas fa-arrow-right" style="color: #94a3b8; margin-top: 18px;"></i>
          <div class="color-item">
            <small style="color: #94a3b8;">Color Final</small>
            <input type="color" id="input-gradiente-2" value="#0369a1">
          </div>
        </div>

        <small style="display: block; margin-top: 10px; color: #94a3b8;">Vista Previa en Vivo del Banner:</small>
        <div id="preview-banner-live" class="preview-box">
          🔔 PACIENTE EN ATENCIÓN (EJEMPLO)
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>2. Pie de Página (Ticker)</h3>
      <div class="color-pickers-row" style="margin-bottom: 10px;">
        <div class="color-item">
          <label>Fondo Pie:</label>
          <input type="color" id="input-color-footer-bg" value="#0f172a">
        </div>
        <div class="color-item">
          <label>Texto Pie:</label>
          <input type="color" id="input-color-footer-text" value="#ffffff">
        </div>
      </div>
    </div>

    <button id="btn-guardar-config" class="btn-guardar"><i class="fas fa-save"></i> Guardar Configuración</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://estado-pacientes-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const selectMarca = document.getElementById('select-marca-admin');
    const inputColorHeader = document.getElementById('input-color-header');
    const inputColorAcento = document.getElementById('input-color-acento');
    const inputGradiente1 = document.getElementById('input-gradiente-1');
    const inputGradiente2 = document.getElementById('input-gradiente-2');
    const previewBanner = document.getElementById('preview-banner-live');
    const inputFooterBg = document.getElementById('input-color-footer-bg');
    const inputFooterText = document.getElementById('input-color-footer-text');
    const btnGuardar = document.getElementById('btn-guardar-config');

    function actualizarVistaPrevia() {
      const g1 = inputGradiente1.value;
      const g2 = inputGradiente2.value;
      const gradienteCSS = `linear-gradient(135deg, ${g1}, ${g2})`;
      previewBanner.style.background = gradienteCSS;
      previewBanner.style.borderColor = inputColorAcento.value;
    }

    inputGradiente1.addEventListener('input', actualizarVistaPrevia);
    inputGradiente2.addEventListener('input', actualizarVistaPrevia);
    inputColorAcento.addEventListener('input', actualizarVistaPrevia);

    function cargarConfiguracionMarca(marcaKey) {
      onValue(ref(db, `configuracion_tv/${marcaKey}`), snapshot => {
        const data = snapshot.val();
        if (!data) return;

        if (data.colorHeader) inputColorHeader.value = data.colorHeader;
        if (data.colorAcento) inputColorAcento.value = data.colorAcento;
        if (data.colorFooterBg) inputFooterBg.value = data.colorFooterBg;
        if (data.colorFooterText) inputFooterText.value = data.colorFooterText;

        if (data.colorBanner && data.colorBanner.includes('linear-gradient')) {
          const matches = data.colorBanner.match(/#[a-fA-F0-9]{6}/g);
          if (matches && matches.length >= 2) {
            inputGradiente1.value = matches[0];
            inputGradiente2.value = matches[1];
          }
        }
        actualizarVistaPrevia();
      }, { onlyOnce: true });
    }

    selectMarca.addEventListener('change', () => cargarConfiguracionMarca(selectMarca.value));
    cargarConfiguracionMarca(selectMarca.value);

    btnGuardar.addEventListener('click', () => {
      const marcaKey = selectMarca.value;
      const gradienteCSS = `linear-gradient(135deg, ${inputGradiente1.value}, ${inputGradiente2.value})`;

      set(ref(db, `configuracion_tv/${marcaKey}`), {
        colorHeader: inputColorHeader.value,
        colorAcento: inputColorAcento.value,
        colorBanner: gradienteCSS,
        colorFooterBg: inputFooterBg.value,
        colorFooterText: inputFooterText.value
      }).then(() => {
        alert('✅ Configuración guardada exitosamente');
      }).catch(err => {
        alert('❌ Error al guardar: ' + err.message);
      });
    });
  </script>
</body>
</html>
