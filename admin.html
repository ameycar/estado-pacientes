<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estado de Pacientes - Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      color: #1e293b;
    }

    /* Barra de navegación superior */
    .navbar {
      background-color: #6b0f1a; /* Rojo Vino */
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .navbar-title {
      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-links a {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* Contenido Principal */
    .content-container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }

    .card h2 {
      margin-top: 0;
      color: #1e293b; /* Azul Oscuro */
      font-size: 22px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .card p {
      color: #64748b;
      margin-bottom: 20px;
    }

    .btn-modulo {
      display: inline-block;
      background-color: #1e293b; /* Azul Oscuro */
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn-modulo:hover {
      background-color: #6b0f1a; /* Rojo Vino al pasar el cursor */
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar">
    <div class="navbar-title">Estado de Pacientes — Admin</div>
    <div class="nav-links">
      <a href="index.html" class="active">Pacientes</a>
      <a href="resumen.html" target="_blank">Resumen</a>
      <a href="sedes.html">Sedes</a>
      <a href="usuarios.html">Usuarios</a>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <div class="content-container">
    <div class="card">
      <h2>Módulo de Pacientes</h2>
      <p>Accede al panel de control para registrar, modificar estados, firmas de entrega y gestionar los registros de los pacientes.</p>
      
      <a href="index.html" class="btn-modulo">
        📋 Abrir Módulo de Pacientes (index.html)
      </a>
    </div>
  </div>

</body>
</html>
