<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Estado de Pacientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header style="display:flex; justify-content:space-between; align-items:center; padding:12px 18px; background-color:#3d0a11; color:white;">
    <div style="font-weight:700">Estado de Pacientes — Admin</div>
    <nav>
      <a href="#" onclick="mostrarSeccion('pacientes')" style="margin-right:12px; color:#fff; text-decoration:none;">Pacientes</a>
      <!-- Enlace directo al módulo Resumen de la sala de espera -->
      <a href="resumen.html" target="_blank" style="margin-right:12px; color:#fff; text-decoration:none;">Resumen</a>
      <a href="#" onclick="mostrarSeccion('sedes')" style="color:#fff; text-decoration:none;">Sedes</a>
      <a href="#" onclick="mostrarSeccion('usuarios')" style="color:#fff; text-decoration:none; margin-left:12px;">Usuarios</a>
    </nav>
  </header>

  <main style="padding:18px;">
    <!-- SECCIÓN PACIENTES -->
    <section id="pacientes" class="seccion" style="display:block;">
      <h2>Pacientes</h2>
      <p><a href="index.html" target="_blank">Abrir módulo Pacientes (index.html)</a></p>
    </section>

    <!-- SECCIÓN SEDES -->
    <section id="sedes" class="seccion" style="display:none; max-width:900px;">
      <h2>Sedes</h2>
      <form id="form-sede" style="display:flex; gap:8px; align-items:center; margin-bottom:15px;">
        <input id="sedeNombre" placeholder="Nombre de la sede" required style="padding:8px; border:1px solid #ccc; border-radius:4px;">
        <input id="sedeDireccion" placeholder="Dirección (opcional)" style="padding:8px; border:1px solid #ccc; border-radius:4px;">
        <label style="display:flex; align-items:center; gap:6px;">
          <input id="sedeActiva" type="checkbox" checked> Activa
        </label>
        <!-- type="button" para evitar que recargue la página y se borre el estado -->
        <button type="button" id="btnGuardarSede" style="padding:8px 12px; border-radius:6px; background:#3d0a11; color:white; border:none; cursor:pointer;">Guardar</button>
      </form>

      <table id="tabla-sedes" style="width:100%; border-collapse:collapse;">
        <thead>
          <tr style="background:#f2f2f2;">
            <th style="padding:8px; border:1px solid #ddd; text-align:left;">Nombre</th>
            <th style="padding:8px; border:1px solid #ddd; text-align:left;">Dirección</th>
            <th style="padding:8px; border:1px solid #ddd; text-align:center;">Activa</th>
            <th style="padding:8px; border:1px solid #ddd; text-align:center;">Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- SECCIÓN USUARIOS -->
    <section id="usuarios" class="seccion" style="display:none; max-width:900px;">
      <h2>Usuarios</h2>
      <p>Gestión de usuarios y accesos.</p>
    </section>
  </main>

  <!-- SDKs de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <!-- Configuración de Firebase -->
  <script src="firebase-config.js"></script>

  <!-- Script principal del Admin -->
  <script src="admin.js"></script>

  <!-- Lógica de Navegación SPA -->
  <script>
    function mostrarSeccion(idSeccion) {
      const secciones = document.querySelectorAll('.seccion');
      secciones.forEach(sec => sec.style.display = 'none');

      const seccionSeleccionada = document.getElementById(idSeccion);
      if (seccionSeleccionada) {
        seccionSeleccionada.style.display = 'block';
      }
    }
  </script>
</body>
</html>
