<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estado de Pacientes - Panel Administrativo</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <script>
    const usuario = localStorage.getItem("user");
    // if (!usuario) { window.location.href = 'login.html'; }
  </script>

  <h1>Estado de Pacientes</h1>

  <div style="text-align: right; margin-bottom: 10px;">
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <!-- FORMULARIO DE REGISTRO -->
  <form id="formulario">
    <label for="sede">Sede:</label>
    <select id="sede" required>
      <!-- Carga dinámicamente desde Firebase -->
    </select>

    <label for="apellidos">Apellidos:</label>
    <input type="text" id="apellidos" required>

    <label for="nombres">Nombres:</label>
    <input type="text" id="nombres" required>

    <label for="estudios">Estudios:</label>
    <select id="estudios" multiple required>
      <option value="Consulta Medicina">Consulta Medicina</option>
      <option value="eco">eco</option>
      <option value="Reevaluación">Reevaluación</option>
      <option value="Eco tv">Eco tv</option>
      <option value="Eco doppler">Eco doppler</option>
      <option value="Eco abdomen completo">Eco abdomen completo</option>
      <option value="Eco renal">Eco renal</option>
      <option value="Eco mamaria">Eco mamaria</option>
      <option value="Eco obstetrica">Eco obstetrica</option>
      <option value="Eco pelvica">Eco pelvica</option>
      <option value="Eco abdomen sup">Eco abdomen sup</option>
      <option value="Eco abdomen inf">Eco abdomen inf</option>
      <option value="Eco pb">Eco pb</option>
      <option value="TEM">Tomografía</option>
      <option value="RM">Resonancia Magnética</option>
      <option value="RX">Rayos X</option>
      <option value="Mamografia">Mamografía</option>
      <option value="Eco prostata">Eco prostata</option>
      <option value="Eco genética">Eco genética</option>
      <option value="Eco morfo">Eco morfo</option>
      <option value="Eco 4d">Eco 4d</option>
      <option value="Eco 5d">Eco 5d</option>
      <option value="Eco vias urinarias">Eco vias urinarias</option>
    </select>

    <div id="cantidad-eco-pb" style="display:none;">
      <label for="ecoPbCantidad">Cantidad Eco pb:</label>
      <select id="ecoPbCantidad">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option><option value="9">9</option>
        <option value="10">10</option>
      </select>
    </div>

    <label for="precio">Precio:</label>
    <input type="number" id="precio" required>

    <label for="pf">PF (ticket de pago):</label>
    <input type="text" id="pf" required>

    <button type="submit">Registrar</button>
  </form>

  <!-- CONTADOR DE PACIENTES EN ESPERA -->
  <div id="contador" style="margin-top: 20px; font-weight: bold;">Pacientes en espera: 0</div>

  <!-- FILTROS DE BÚSQUEDA -->
  <div id="filtros" style="margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
    <label for="filtroSede">Sede: <input type="text" id="filtroSede" placeholder="Buscar sede..."></label>
    <label for="filtroNombre">Nombre/Apellido: <input type="text" id="filtroNombre" placeholder="Buscar por nombre..."></label>
    <label for="filtroEstudio">Estudio: <input type="text" id="filtroEstudio" placeholder="Buscar estudio..."></label>
    <label for="filtroFecha">Fecha: <input type="date" id="filtroFecha"></label>
    <button onclick="exportarExcel()">Exportar a Excel</button>
  </div>

  <!-- TABLA PRINCIPAL DE ADMINISTRACIÓN -->
  <div style="overflow-x: auto; margin-top: 15px;">
    <table>
      <thead>
        <tr>
          <th>Sede</th>
          <th>Apellidos</th>
          <th>Nombres</th>
          <th>Estudios</th>
          <th style="width:50px">Cant</th>
          <th>Precio</th>
          <th>PF</th>
          <th>Estado</th>
          <th style="width:60px">Placas</th>
          <th style="width:50px">CD</th>
          <th style="width:60px">Informe</th>
          <th style="width:80px">Entregado</th>
          <th style="width:100px">Firma</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-pacientes">
        <!-- Los datos se generan dinámicamente -->
      </tbody>
    </table>
  </div>

  <!-- CUADROS DE PAGINACIÓN -->
  <div id="paginacionTabla" style="margin: 20px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;"></div>

  <!-- MODAL DE ENTREGA Y FIRMA -->
  <div id="modalFirma" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:9999;">
    <div style="background:white; padding:20px; border-radius:8px; max-width:420px; width:95%; box-sizing:border-box;">
      <h3 style="margin-top:0;">Finalizar Entrega</h3>

      <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
        <label style="min-width:60px;">Placas:</label>
        <input id="modal_placas" type="number" min="0" placeholder="nro" style="width:80px;">
      </div>

      <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
        <label style="min-width:60px;">CD:</label>
        <select id="modal_cd" style="width:120px;">
          <option value="">Seleccione</option>
          <option value="SI">SI</option>
          <option value="NO">NO</option>
        </select>
      </div>

      <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
        <label style="min-width:60px;">Informe:</label>
        <select id="modal_informe" style="width:120px;">
          <option value="">Seleccione</option>
          <option value="SI">SI</option>
          <option value="NO">NO</option>
        </select>
      </div>

      <div style="margin:8px 0;">
        <label>Firma:</label>
        <canvas id="canvasFirma" width="360" height="200" style="border:1px solid #000; touch-action: none; display:block; margin:6px 0; width:100%;"></canvas>
        <div style="display:flex; gap:8px; justify-content:center;">
          <button id="modal_limpiar_firma" type="button">Limpiar</button>
          <button id="modal_save_entrega" type="button">Guardar Entrega</button>
          <button id="modal_cancel_entrega" type="button">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
  <script>
    function cerrarSesion() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
