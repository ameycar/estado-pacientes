<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estado de Pacientes</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <script>
    // Control simple de sesión
    const usuario = localStorage.getItem("user");
    // if (!usuario) { window.location.href = 'login.html'; }
  </script>

  <h1>Estado de Pacientes</h1>

  <div style="text-align: right; margin-bottom: 10px;">
    <button class="btn small danger" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <div class="panel">
    <form id="formulario" class="form-grid">
      <div>
        <label for="sede">Sede:</label>
        <select id="sede" required>
          <!-- Carga dinámicamente desde Firebase -->
        </select>
      </div>

      <div>
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" required>
      </div>

      <div>
        <label for="nombres">Nombres:</label>
        <input type="text" id="nombres" required>
      </div>

      <div>
        <label for="estudios">Estudios:</label>
        <select id="estudios" multiple required>
          <option value="Consulta Medicina">Consulta Medicina</option>
          <option value="eco">eco</option>
          <option value="Reevaluación">Reevaluación</option>
          <option value="Eco tv">Eco tv</option>
          <option value="Eco doppler">Eco doppler</option>
          <option value="Eco abdomen completo">Eco abdomen completo</option>
          <option value="Eco renal">Eco renal</option>
          <option value="Eco mamaria">Eco mamaria</option>
          <option value="Eco obstetrica">Eco obstetrica</option>
          <option value="Eco pelvica">Eco pelvica</option>
          <option value="Eco abdomen sup">Eco abdomen sup</option>
          <option value="Eco abdomen inf">Eco abdomen inf</option>
          <option value="Eco pb">Eco pb</option>
          <option value="TEM">Tomografía</option>
          <option value="RM">Resonancia Magnética</option>
          <option value="RX">Rayos X</option>
          <option value="Mamografia">Mamografía</option>
          <option value="Eco prostata">Eco prostata</option>
          <option value="Eco genética">Eco genética</option>
          <option value="Eco morfo">Eco morfo</option>
          <option value="Eco 4d">Eco 4d</option>
          <option value="Eco 5d">Eco 5d</option>
          <option value="Eco vias urinarias">Eco vias urinarias</option>
        </select>
      </div>

      <div id="cantidad-eco-pb" style="display:none;">
        <label for="ecoPbCantidad">Cantidad Eco pb:</label>
        <select id="ecoPbCantidad">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option><option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>

      <div>
        <label for="precio">Precio:</label>
        <input type="number" id="precio" required>
      </div>

      <div>
        <label for="pf">PF (ticket de pago):</label>
        <input type="text" id="pf" required>
      </div>

      <button type="submit" class="btn primary" style="grid-column: 1 / -1;">Registrar Paciente</button>
    </form>
  </div>

  <div id="contador">Pacientes en espera: 0</div>

  <div id="filtros" class="panel">
    <div class="form-grid">
      <div>
        <label for="filtroSede">Filtrar por sede:</label>
        <input type="text" id="filtroSede" placeholder="Sede...">
      </div>

      <div>
        <label for="filtroNombre">Filtrar por nombre/apellido:</label>
        <input type="text" id="filtroNombre" placeholder="Nombre o apellido...">
      </div>

      <div>
        <label for="filtroEstudio">Filtrar por estudio:</label>
        <input type="text" id="filtroEstudio" placeholder="Estudio...">
      </div>

      <div>
        <label for="filtroFecha">Filtrar por fecha:</label>
        <input type="date" id="filtroFecha">
      </div>

      <div style="display: flex; align-items: flex-end;">
        <button class="btn" onclick="exportarExcel()">Exportar a Excel</button>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table class="tabla">
      <thead>
        <tr>
          <th>Sede</th><th>Apellidos</th><th>Nombres</th><th>Estudios</th>
          <th style="width:60px">Cant</th><th>Precio</th><th>PF</th><th>Estado</th>
          <th style="width:70px">Placas</th><th style="width:70px">CD</th><th style="width:70px">Informe</th>
          <th style="width:90px">Entregado</th><th style="width:110px">Firma</th><th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-pacientes"></tbody>
    </table>
  </div>

  <!-- CONTENEDOR DE PAGINACIÓN EN CUADRITOS -->
  <div id="paginacion" class="paginacion-container"></div>

  <!-- MODAL: Entrega (placas/cd/informe + firma) -->
  <div id="modalFirma" class="modal" aria-hidden="true">
    <div class="modal-content">
      <h3>Finalizar Entrega</h3>

      <div class="modal-row">
        <label for="modal_placas">Placas:</label>
        <input id="modal_placas" type="number" min="0" placeholder="nro" style="width:100px;">
      </div>

      <div class="modal-row">
        <label for="modal_cd">CD:</label>
        <select id="modal_cd" style="width:140px;">
          <option value="">Seleccione</option>
          <option value="SI">SI</option>
          <option value="NO">NO</option>
        </select>
      </div>

      <div class="modal-row">
        <label for="modal_informe">Informe:</label>
        <select id="modal_informe" style="width:140px;">
          <option value="">Seleccione</option>
          <option value="SI">SI</option>
          <option value="NO">NO</option>
        </select>
      </div>

      <div style="margin:12px 0;">
        <label>Firma del Paciente:</label>
        <canvas id="canvasFirma" class="canvas-firma"></canvas>
        <div class="modal-actions">
          <button id="modal_limpiar_firma" class="btn" type="button">Limpiar</button>
          <button id="modal_save_entrega" class="btn primary" type="button">Guardar Entrega</button>
          <button id="modal_cancel_entrega" class="btn danger" type="button">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Script principal modular -->
  <script type="module" src="./script.js"></script>

  <script>
    function cerrarSesion() {
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
