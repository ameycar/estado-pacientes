<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resumen de Pacientes</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #1e293b;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    h1 {
      color: #6b0f1a; /* Rojo Vino */
      margin-top: 0;
      font-size: 26px;
      border-bottom: 2px solid #6b0f1a;
      padding-bottom: 10px;
    }
    .tarjeta-contador {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: #1e293b; /* Azul Oscuro */
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 20px;
      font-size: 15px;
    }
    .badge-espera {
      background-color: #b91c1c; /* Rojo vivo */
      color: #ffffff;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 16px;
    }
    .filtros-box {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }
    .filtros-box label {
      font-weight: 600;
      color: #0f172a;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .filtros-box input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    .tabla-container {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th {
      background-color: #1e293b; /* Azul Oscuro */
      color: #ffffff;
      padding: 12px;
      text-align: left;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    /* Filas por estado */
    tr.estado-espera { background-color: #fef2f2; }
    tr.estado-atencion { background-color: #fefce8; }
    tr.estado-programado { background-color: #eff6ff; }
    tr.estado-atendido { background-color: #f0fdf4; }

    .paginacion {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
    }
    .paginacion button {
      padding: 6px 14px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #1e293b;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .paginacion button.active {
      background-color: #6b0f1a; /* Rojo Vino */
      color: #ffffff;
      border-color: #6b0f1a;
    }
  </style>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
  <div class="container">
    <h1>Resumen de Pacientes</h1>

    <!-- Contador de pacientes en espera -->
    <div class="tarjeta-contador">
      Pacientes en espera: <span id="contadorEspera" class="badge-espera">0</span>
    </div>

    <!-- Filtros -->
    <div class="filtros-box">
      <label>
        Filtrar por sede:
        <input type="text" id="filtroSede" placeholder="Escribe la sede...">
      </label>
      <label>
        Filtrar por fecha:
        <input type="date" id="filtroFecha">
      </label>
    </div>

    <!-- Tabla -->
    <div class="tabla-container">
      <table>
        <thead>
          <tr>
            <th>Sede</th>
            <th>Apellidos</th>
            <th>Nombres</th>
            <th>Estudios</th>
            <th style="text-align: center;">Cant</th>
            <th>Estado</th>
            <th>Fecha Modificación</th>
          </tr>
        </thead>
        <tbody id="tabla-resumen">
          <!-- Datos dinámicos -->
        </tbody>
      </table>
    </div>

    <!-- Paginación -->
    <div id="paginacion" class="paginacion"></div>
  </div>

  <script src="resumen.js"></script>
</body>
</html>
